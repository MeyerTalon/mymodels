# ~33.7M parameters (33,674,240; weight-tied embeddings)
# model configuration — tuned to train on Apple silicon with ~24GB unified memory
model_name: shakespeare_medium

# tokenizer
vocab_size: 16000
min_frequency: 2

# model architecture
d_model: 512
n_heads: 8
n_layers: 8
d_ff: 2048
max_seq_len: 512
dropout: 0.1

# training configuration
num_epochs: 40
batch_size: 16
grad_accum_steps: 4          # effective batch = 64 sequences of 512 tokens
learning_rate: 0.0003
min_lr: 0.00003
weight_decay: 0.1
warmup_epochs: 4
max_grad_norm: 1.0
precision: bf16              # bf16 has fp32 exponent range: stable on MPS without a grad scaler (fp16 diverges there)
val_fraction: 0.05
save_every: 1
log_interval: 50

# data configuration — Project Gutenberg complete works (ebook #100)
data_dir: shakespeare/data
corpus_url: https://www.gutenberg.org/files/100/100-0.txt
max_works: null              # null = entire corpus; set an int for smoke tests
dataset_cache_only: False    # require a compatible local snapshot when True
num_workers: 4

# weights directory
weights_dir: shakespeare/weights

# reports directory (per-run loss charts: <reports_dir>/<model_name>_<date>_<time>/report.png)
reports_dir: shakespeare/reports
