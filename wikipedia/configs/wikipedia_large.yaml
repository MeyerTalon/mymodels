# ~110.4M parameters (110,418,432; weight-tied embeddings)
# model configuration — GPT-2-base scale; heavy for ~24GB unified memory,
# so batch_size is small and made up for with gradient accumulation
model_name: wikipedia_large
number_of_articles: 50000

# tokenizer
vocab_size: 32000
min_frequency: 2

# model architecture
d_model: 768
n_heads: 12
n_layers: 12
d_ff: 3072
max_seq_len: 1024
dropout: 0.1

# training configuration
num_epochs: 20
batch_size: 4
grad_accum_steps: 16         # effective batch = 64 sequences of 1024 tokens
learning_rate: 0.0003
min_lr: 0.00003
weight_decay: 0.1
warmup_epochs: 2
max_grad_norm: 1.0
precision: bf16              # bf16 has fp32 exponent range: stable on MPS without a grad scaler (fp16 diverges there)
val_fraction: 0.005
save_every: 1
log_interval: 50

# data configuration
data_dir: wikipedia/data
dataset_name: wikimedia/wikipedia
dataset_config: 20231101.en
dataset_split: train
dataset_revision: e6057dc557255a03c9c3c47ceab0eb44353b1bc5
dataset_seed: 42
shuffle_buffer_size: 10000
dataset_cache_only: False    # require a compatible local snapshot when True
num_workers: 4

# weights directory
weights_dir: wikipedia/weights

# reports directory (per-run loss charts: <reports_dir>/<model_name>_<date>_<time>/report.png)
reports_dir: wikipedia/reports
