# ~7.6M parameters (7,610,880; weight-tied shared embeddings)
# model configuration
model_name: translation_small

# tokenizer
vocab_size: 8000
min_frequency: 2
languages: [en, es, fr, de]

# model architecture
d_model: 256
n_heads: 4
n_encoder_layers: 3
n_decoder_layers: 3
d_ff: 1024
max_seq_len: 128
dropout: 0.1

# training configuration
num_epochs: 10
batch_size: 16
grad_accum_steps: 1          # effective batch = batch_size * grad_accum_steps
learning_rate: 0.0003
min_lr: 0.00003
weight_decay: 0.1
warmup_epochs: 1
max_grad_norm: 1.0
precision: bf16              # bf16 has fp32 exponent range: stable on MPS without a grad scaler (fp16 can diverge there)
val_fraction: 0.05
save_every: 1
log_interval: 50

# data configuration — local parallel corpus (no download)
data_dir: translation/data
corpus_dir: translation/data/corpus   # place *.tsv / *.jsonl pairs here
max_pairs: null              # null = entire corpus; set an int for smoke tests
dataset_cache_only: False    # require a compatible local snapshot when True
num_workers: 2

# weights directory
weights_dir: translation/weights

# reports directory (per-run loss charts: <reports_dir>/<model_name>_<date>_<time>/report.png)
reports_dir: translation/reports
