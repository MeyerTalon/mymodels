model_name: translation_small
expected_parameters: 7610880

vocab_size: 8000
min_frequency: 2
languages: [en, es, fr, de]

d_model: 256
n_heads: 4
n_encoder_layers: 3
n_decoder_layers: 3
d_ff: 1024
max_seq_len: 128
dropout: 0.1

num_epochs: 10
batch_size: 16
grad_accum_steps: 1
learning_rate: 0.0003
min_lr: 0.00003
weight_decay: 0.1
warmup_epochs: 1
max_grad_norm: 1.0
precision: bf16
val_fraction: 0.05
save_every: 1
log_interval: 50

data_dir: translation/data
corpus_dir: translation/data/corpus
max_pairs: null
dataset_cache_only: false
num_workers: 2

weights_dir: translation/weights
reports_dir: translation/reports
