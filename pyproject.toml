[project]
name = "mymodels"
version = "0.1.0"
description = "Personal PyTorch models."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
    "datasets>=5.0.0",
    "matplotlib>=3.11.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "tokenizers>=0.22.1",
    "torch>=2.9.1",
    "torchvision>=0.28.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.0.3",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
    "types-tqdm>=4.70.0.20260906",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = [
    "ANN",
    "B",
    "BLE",
    "C4",
    "ERA",
    "FBT",
    "I",
    "PGH",
    "PLR2004",
    "PTH",
    "RET",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "typings"
files = ["core", "gpt", "mnist", "shakespeare", "translation", "western", "wikipedia"]

[tool.pytest]
testpaths = [
    "core/tests",
    "gpt/tests",
    "mnist/tests",
    "shakespeare/tests",
    "translation/tests",
    "western/tests",
    "wikipedia/tests",
]
