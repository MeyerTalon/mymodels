# ~0.42M parameters (421,642)
# model configuration
model_name: mnist_small

# model architecture
in_channels: 1
conv1_channels: 32
conv2_channels: 64
hidden_dim: 128
num_classes: 10
dropout: 0.25

# training configuration
num_epochs: 10000
batch_size: 64
grad_accum_steps: 1          # effective batch = batch_size * grad_accum_steps
learning_rate: 0.001
min_lr: 0.0001
weight_decay: 0.01
warmup_epochs: 0
max_grad_norm: 1.0
precision: bf16              # bf16 has fp32 exponent range: stable on MPS without a grad scaler (fp16 can diverge there)
val_fraction: 0.1
save_every: 1
log_interval: 50

# data configuration
data_dir: mnist/data
dataset_seed: 42
dataset_cache_only: False    # require a local torchvision MNIST cache when True
num_workers: 2

# weights directory
weights_dir: mnist/weights

# reports directory (per-run charts: <reports_dir>/<model_name>_<date>_<time>/report.png)
reports_dir: mnist/reports
